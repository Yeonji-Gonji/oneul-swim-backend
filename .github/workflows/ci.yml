# PR 게이트: 포맷 검사, lint·typecheck·test·build 를 잡 하나에서 돌린다.
#
# - main 머지가 곧 운영 배포(deploy.yml)라, 이 잡(verify)이 main 룰셋 main-pr-ci 의 필수 체크다.
#   잡 이름을 바꾸면 룰셋의 필수 체크 이름도 같이 바꿔야 한다. 안 바꾸면 모든 PR 이 체크 대기로 막힌다.
# - Actions 비용은 잡 수로 매겨지므로 단계를 잡으로 쪼개지 않는다.
# - 문서만 바꾼 변경은 무거운 단계를 건너뛰고 통과로 끝난다. 필수 체크인 워크플로를 paths-ignore 로
#   건너뛰면 체크가 대기 상태로 남아 머지가 막히므로, 잡은 항상 돌고 첫 단계에서 바뀐 경로를 본다.
# - 포맷 검사(pnpm format:check)는 문서 전용 변경에도 돈다. docs/ 는 .prettierignore 로 빠지지만 docs/ 밖의 *.md(README.md)는
#   검사 대상이라, 건너뛰면 위반이 쌓였다가 다음 코드 PR 이 남의 파일로 실패한다.
# - Node 는 운영 이미지(Dockerfile 의 node:22-alpine)와 맞춘다. pnpm 버전은 package.json 의 packageManager 를 따른다.
# - 테스트(test/*.spec.ts)는 DB 없이 도는 단위 테스트다. 실제 DB 테스트를 더하면 이 잡에 postgres 서비스를 붙인다.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # PR 은 새 커밋이 오면 이전 실행을 끊고, main 실행은 끝까지 남긴다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 바뀐 경로로 문서 전용 변경인지 판정
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # 이름이 바뀐 파일은 옛 경로도 본다(코드 파일을 docs/ 로 옮기면 코드가 빠지는 변경이다)
          if [ "$EVENT_NAME" = pull_request ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[] | .filename, (.previous_filename // empty)') || files=''
          else
            # 비교 API 는 파일을 300개까지만 준다. 300개면 잘렸을 수 있으므로 목록을 비워 전체 검사로 보낸다
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$AFTER_SHA" \
              --jq 'if (.files | length) >= 300 then empty else (.files[] | .filename, (.previous_filename // empty)) end') || files=''
          fi
          # 목록을 못 받으면 전체 검사
          docs_only=false
          if [ -n "$files" ]; then
            docs_only=true
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                docs/* | *.md) ;;
                *) docs_only=false; break ;;
              esac
            done <<< "$files"
          fi
          echo "바뀐 경로 $(printf '%s\n' "$files" | grep -c . || true)개, 문서 전용 변경: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: 문서 전용 변경이라 검사를 건너뜀
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "docs/ 와 *.md 만 바뀌어 포맷 검사만 돌고 lint·typecheck·test·build 를 건너뜁니다."

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 문서 전용 변경에도 돈다(머리 주석). 실패하면 로컬에서 pnpm format 으로 고친다
      - name: 포맷 검사
        run: pnpm format:check

      # pnpm check = prisma generate → lint → typecheck → test → build (package.json)
      - name: lint·typecheck·test·build
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm check
