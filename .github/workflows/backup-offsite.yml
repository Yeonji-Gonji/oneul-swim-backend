# DB 백업 외부 보관: 서버의 최신 일일 덤프(scripts/backup.sh, 매일 03:30 UTC)를 받아
# age 공개키로 암호화한 뒤 Actions artifact 로 30일 보관한다. 오라클 계정 잠김·서버 손실에도 남는 사본이다.
#
# - 공개 리포의 artifact 는 GitHub 에 로그인한 누구나 받을 수 있어 반드시 암호화해 올린다. 복호화 비밀키는 리포·서버에 없다(비밀번호 관리자).
# - 리포 변수 BACKUP_AGE_RECIPIENT(age 공개키)가 있을 때만 돈다.
# - 서버 호스트 키 지문은 리포 변수 SSH_HOST_KEY_FP 다(deploy.yml·server-ops.yml 과 같은 값). 서버를 다시 만들면 갱신한다.
# - 서버 덤프가 26시간보다 오래됐거나 gzip 이 깨졌으면 실패한다. 실패 메일이 곧 서버 백업 크론 이상 신호다.
# - 공개 리포는 60일 동안 커밋이 없으면 schedule 워크플로가 꺼진다. 꺼지면 Actions 탭에서 다시 켠다.
# - 복구 절차: docs/OPERATIONS.md §3
name: Offsite backup (encrypted)

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC, 서버 덤프 30분 뒤
  workflow_dispatch:

concurrency:
  group: backup-offsite
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: backup
    if: vars.BACKUP_AGE_RECIPIENT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: age 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: SSH 준비(서버 호스트 키 지문 고정)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          HOST_KEY_FP: ${{ vars.SSH_HOST_KEY_FP }}
        run: |
          set -euo pipefail
          [ -n "$HOST_KEY_FP" ] || { echo "::error::리포 변수 SSH_HOST_KEY_FP 가 없습니다"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -t ed25519 "$SSH_HOST" 2>/dev/null > "$RUNNER_TEMP/kh"
          fp=$(ssh-keygen -lf "$RUNNER_TEMP/kh" | awk '{print $2}')
          [ "$fp" = "$HOST_KEY_FP" ] || { echo "::error::서버 호스트 키 지문이 다릅니다($fp)"; exit 1; }
          mv "$RUNNER_TEMP/kh" ~/.ssh/known_hosts

      - name: 최신 덤프 확인·전송·암호화
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          remote() { ssh -i ~/.ssh/id -o BatchMode=yes "$SSH_USER@$SSH_HOST" "$@"; }
          # 작은따옴표 안의 $f·$(...) 는 서버 셸에서 펼쳐져야 한다
          # shellcheck disable=SC2016
          if ! read -r name mtime size sha < <(remote 'f=$(ls -t ~/oneul-swim-backups/oneul_swim_*.sql.gz 2>/dev/null | head -1); [ -n "$f" ] && gzip -t "$f" && echo "$(basename "$f") $(stat -c %Y "$f") $(stat -c %s "$f") $(sha256sum < "$f" | cut -d" " -f1)"'); then
            echo "::error::서버에서 온전한 덤프(~/oneul-swim-backups/oneul_swim_*.sql.gz)를 찾지 못했습니다"
            exit 1
          fi
          age_h=$(( ($(date +%s) - mtime) / 3600 ))
          echo "최신 덤프: $name (${size}B, ${age_h}시간 전)"
          [ "$age_h" -le 26 ] || { echo "::error::서버 덤프가 ${age_h}시간 전 것입니다. 서버 백업 크론을 확인하세요."; exit 1; }
          remote "cat ~/oneul-swim-backups/$name" > dump.sql.gz
          echo "$sha  dump.sql.gz" | sha256sum -c --quiet -
          mkdir -p out && age -r "$RECIPIENT" -o "out/$name.age" dump.sql.gz && rm -f dump.sql.gz
          echo "ARTIFACT=${name%.sql.gz}" >> "$GITHUB_ENV"
          ls -l out

      - name: artifact 업로드(30일 보관)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: out/*.age
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
