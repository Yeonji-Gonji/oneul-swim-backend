# 서버 읽기 전용 조회(workflow_dispatch). 로컬에 SSH 키가 없어도 Secrets 의 SSH_KEY 로 서버 상태를 본다. 서버를 바꾸는 작업은 넣지 않는다.
#   diff-deploy-files : 서버 ~/app 의 docker-compose.yml·Caddyfile·scripts/*.sh 와 이 ref 의 파일을 diff
#   show-state        : .env 의 API_IMAGE_TAG*, compose ps, 이미지 목록, 메모리, 디스크 (시크릿 값은 출력하지 않는다)
# 실행: gh workflow run server-ops.yml -R Yeonji-Gonji/oneul-swim-backend --ref <브랜치> -f task=diff-deploy-files
# 서버에는 외부 액션 없이 ssh 로 붙고, 서버 호스트 키 지문이 리포 변수 SSH_HOST_KEY_FP 와 같을 때만 붙는다(deploy.yml 과 같은 방식).
name: Server ops (read-only)

on:
  workflow_dispatch:
    inputs:
      task:
        description: 조회 작업
        type: choice
        required: true
        options: [diff-deploy-files, show-state]

permissions:
  contents: read

# 배포와 같은 그룹: 배포 중에는 끼어들지 않는다
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  run:
    name: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: SSH 준비(서버 호스트 키 지문 고정)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          HOST_KEY_FP: ${{ vars.SSH_HOST_KEY_FP }}
        run: |
          set -euo pipefail
          [ -n "$HOST_KEY_FP" ] || { echo "::error::리포 변수 SSH_HOST_KEY_FP 가 없습니다"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -t ed25519 "$SSH_HOST" 2>/dev/null > "$RUNNER_TEMP/kh"
          fp=$(ssh-keygen -lf "$RUNNER_TEMP/kh" | awk '{print $2}')
          [ "$fp" = "$HOST_KEY_FP" ] || { echo "::error::서버 호스트 키 지문이 다릅니다($fp)"; exit 1; }
          mv "$RUNNER_TEMP/kh" ~/.ssh/known_hosts

      - name: 서버 조회
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TASK: ${{ inputs.task }}
        run: |
          set -uo pipefail
          remote() { ssh -i ~/.ssh/id -o BatchMode=yes "$SSH_USER@$SSH_HOST" "$@"; }
          case "$TASK" in
            diff-deploy-files)
              for f in docker-compose.yml Caddyfile scripts/deploy.sh scripts/backup.sh scripts/duckdns.sh; do
                echo "===== $f: 리포(${GITHUB_SHA::7}) → 서버 ====="
                if remote "cat ~/app/$f" > "$RUNNER_TEMP/server-file" 2>/dev/null; then
                  if diff "$f" "$RUNNER_TEMP/server-file"; then echo "(동일)"; fi
                else
                  echo "(서버에 없음: 다음 배포가 동기화)"
                fi
              done
              ;;
            show-state)
              # 작은따옴표 안의 명령은 서버 셸에서 돈다
              # shellcheck disable=SC2016
              remote '
                cd ~/app || { echo "~/app 없음"; exit 1; }
                echo "===== .env 태그 ====="; grep -E "^API_IMAGE_TAG" .env || echo "(API_IMAGE_TAG 없음)"
                echo "===== compose ps ====="; docker compose ps
                echo "===== images ====="; docker images ghcr.io/yeonji-gonji/oneul-swim-backend --format "{{.Tag}}  {{.Size}}  {{.CreatedAt}}"
                echo "===== memory ====="; docker stats --no-stream --format "{{.Name}}  {{.MemUsage}}  {{.MemPerc}}"; free -m | sed -n 1,2p
                echo "===== disk ====="; df -h / | tail -1; docker system df
              '
              ;;
            *)
              echo "알 수 없는 task: $TASK"
              exit 1
              ;;
          esac
