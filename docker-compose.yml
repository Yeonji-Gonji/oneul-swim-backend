# 오늘수영 백엔드 프로덕션 구성 (VPS 1대: caddy + api + db)
# 서버 ~/app 에 이 파일·Caddyfile·.env·scripts/deploy.sh 가 있고, 배포는 항상 scripts/deploy.sh 가 한다(CI 도 같은 스크립트).
# 로컬에서 띄울 때: .env 에 API_IMAGE_TAG=local 을 두고 `docker compose build api && docker compose up -d`.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    <<: *logging
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 같은 서버의 다른 스택이 넣는 사이트 조각(Caddyfile 의 import). 폴더는 scripts/deploy.sh 가 배포 계정 소유로 만든다.
      - ./conf.d:/etc/caddy/conf.d:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN 미설정}
    # default 는 이 스택(api:3000), caddy_shared 는 다른 스택의 앱 컨테이너(예: aether-api:3100)에 닿는 길이다.
    networks:
      - default
      - caddy_shared
    depends_on:
      - api

  api:
    # 태그는 불변 sha-<short>. .env 의 API_IMAGE_TAG 가 "지금 떠 있는 버전"이자 롤백 기준점이다(latest 없음).
    image: ghcr.io/yeonji-gonji/oneul-swim-backend:${API_IMAGE_TAG:?API_IMAGE_TAG 미설정 - scripts/deploy.sh 가 .env 에 기록한다(로컬은 local)}
    build: .
    restart: unless-stopped
    <<: *logging
    # 호스트에 publish 하지 않는다. caddy 가 compose 네트워크 안에서 api:3000 으로 붙는다.
    environment:
      DATABASE_URL: postgresql://oneul:${POSTGRES_PASSWORD}@db:5432/oneul_swim
      CORS_ORIGINS: ${CORS_ORIGINS}
      PORT: '3000'
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      KAKAO_REST_KEY: ${KAKAO_REST_KEY}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      ADMIN_KAKAO_ID: ${ADMIN_KAKAO_ID}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *logging
    # 서버 안(localhost)에서만 접근 가능. GUI 툴은 SSH 터널로 접속. 외부 인터넷에는 열리지 않는다.
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: oneul
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 미설정}
      POSTGRES_DB: oneul_swim
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oneul -d oneul_swim']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  pgdata:

networks:
  # 같은 서버의 다른 compose 스택과 caddy 가 함께 붙는 외부 네트워크. 이 스택에서는 caddy 만 붙인다(api·db 는 붙이지 않는다).
  # scripts/deploy.sh 가 없으면 만든다. 붙는 서비스 이름이 이 스택의 api·db·caddy 와 겹치면 caddy 의 이름 풀이가 갈린다.
  caddy_shared:
    external: true
