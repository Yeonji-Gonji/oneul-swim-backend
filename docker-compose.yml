# 오늘수영 백엔드 프로덕션 구성 (VPS 1대: caddy + api + db)
# 서버 ~/app 에 이 파일·Caddyfile·.env·scripts/deploy.sh 가 있고, 배포는 항상 scripts/deploy.sh 가 한다(CI 도 같은 스크립트).
# 로컬에서 띄울 때: .env 에 API_IMAGE_TAG=local 을 두고 `docker compose build api && docker compose up -d`.
# 로그는 호스트 journald 로 보낸다. json-file 은 배포로 컨테이너가 교체될 때 이전 로그를 함께 지우지만 journald 는 남긴다.
# 줄마다 CONTAINER_NAME·IMAGE_NAME(배포 태그)이 붙는다. 보존 상한은 서버 journald 설정(기본: 디스크 10%, 최대 4G)을 따른다.
# 조회: journalctl CONTAINER_NAME=app-api-1 --since -1h (docker compose logs 도 그대로 된다). 상세: docs/OPERATIONS.md
# 기본 이미지(caddy·postgres)는 버전+다이제스트로 고정한다. 같은 태그도 베이스 OS 패치로 다시 빌드되면 내용이 바뀌기 때문이다.
# 올리는 건 Dependabot PR(.github/dependabot.yml, 월 1회, 메이저 제외). postgres PR 은 머지 전에 릴리스 노트의 REINDEX 항목을 본다.
# api·db 는 컨테이너 메모리 상한(각 512m)을 둔다. 같은 서버의 다른 스택(aether-takt)과 서로 메모리를 뺏지 않게 하려는 것이다.
x-logging: &logging
  logging:
    driver: journald
    options:
      tag: '{{.Name}}'

services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    <<: *logging
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 같은 서버의 다른 스택이 넣는 사이트 조각(Caddyfile 의 import). 폴더는 scripts/deploy.sh 가 배포 계정 소유로 만든다.
      - ./conf.d:/etc/caddy/conf.d:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN 미설정}
    # default 는 이 스택(api:3000), caddy_shared 는 다른 스택의 앱 컨테이너(예: aether-api:3100)에 닿는 길이다.
    networks:
      - default
      - caddy_shared
    depends_on:
      - api

  api:
    # 태그는 불변 sha-<short>. .env 의 API_IMAGE_TAG 가 "지금 떠 있는 버전"이자 롤백 기준점이다(latest 없음).
    image: ghcr.io/yeonji-gonji/oneul-swim-backend:${API_IMAGE_TAG:?API_IMAGE_TAG 미설정 - scripts/deploy.sh 가 .env 에 기록한다(로컬은 local)}
    build: .
    restart: unless-stopped
    <<: *logging
    # 2026-11-18 실측: 이 스택(caddy·api·db) 전체가 약 100MiB 를 쓴다. 넘으면 컨테이너만 OOM 으로 재시작된다(docs/OPERATIONS.md §8)
    mem_limit: 512m
    # 비루트(node)로 3000 포트만 듣는 프로세스라 리눅스 권한(capability)이 필요 없다
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 호스트에 publish 하지 않는다. caddy 가 compose 네트워크 안에서 api:3000 으로 붙는다.
    environment:
      # 컨테이너 상한 512m 안에서 힙을 384MB 로 묶어 버퍼·네이티브 메모리 몫을 남긴다.
      # docker compose run 으로 돌리는 마이그레이션·데이터 스크립트(npx tsx)에도 같은 상한이 걸린다
      NODE_OPTIONS: --max-old-space-size=384
      DATABASE_URL: postgresql://oneul:${POSTGRES_PASSWORD}@db:5432/oneul_swim
      CORS_ORIGINS: ${CORS_ORIGINS}
      PORT: '3000'
      # 로그와 Actions 출력에 색 코드가 섞이지 않게 한다(Nest 로거가 따른다)
      NO_COLOR: '1'
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      KAKAO_REST_KEY: ${KAKAO_REST_KEY}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      ADMIN_KAKAO_ID: ${ADMIN_KAKAO_ID}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16.16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    <<: *logging
    mem_limit: 512m
    # 서버 안(localhost)에서만 접근 가능. GUI 툴은 SSH 터널로 접속. 외부 인터넷에는 열리지 않는다.
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: oneul
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 미설정}
      POSTGRES_DB: oneul_swim
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oneul -d oneul_swim']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  pgdata:

networks:
  # 같은 서버의 다른 compose 스택과 caddy 가 함께 붙는 외부 네트워크. 이 스택에서는 caddy 만 붙인다(api·db 는 붙이지 않는다).
  # scripts/deploy.sh 가 없으면 만든다. 붙는 서비스 이름이 이 스택의 api·db·caddy 와 겹치면 caddy 의 이름 풀이가 갈린다.
  caddy_shared:
    external: true
